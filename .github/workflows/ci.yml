name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # .nvmrc (Node 24 LTS) is the single version pin, shared with local development.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Show toolchain versions
        run: |
          node --version
          npm --version

      # npm 11 skips dependency install scripts not listed in the root `allowScripts` field.
      # Fail instead, so a dependency bump cannot silently leave better-sqlite3's native build
      # or onnxruntime-node's binaries uninstalled.
      - name: Install dependencies
        run: npm ci
        env:
          npm_config_strict_allow_scripts: "true"

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
