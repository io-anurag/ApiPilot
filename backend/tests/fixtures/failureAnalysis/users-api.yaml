openapi: 3.0.3
info:
  title: Users API
  version: 1.0.0
components:
  schemas:
    # The create body shares no field name with the response, so the only dependency is
    # POST /users → id → GET /users/{id} and no cycle prevents workflow assembly.
    NewUser:
      type: object
      required:
        - displayName
      properties:
        displayName:
          type: string
          minLength: 1
    User:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
paths:
  /users:
    post:
      operationId: createUser
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewUser"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content: {}
