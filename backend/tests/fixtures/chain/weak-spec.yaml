# AP-037 Request-Chain Performance Plans fixture (specs/037-request-chain-performance, tasks T003;
# quickstart scenario 2, US2). A deliberately weak specification, as real ones often are:
# - every request example is a placeholder ("string", 0, user@example.com);
# - POST /customers documents 200, where the real API (the customers-auth stub) answers 201;
# - the token endpoint POST /auth/token is not documented at all, although every operation needs a
#   bearer token;
# - one item path is documented as /customer/{customerId}, where the real API serves
#   /api/v1/customers/{id};
# - POST /users declares a `format: password` field, which seeding records so that a literal typed
#   there later is moved into a secret environment value (FR-027).
openapi: 3.0.3
info:
  title: Weak Customers Specification
  version: "0.1"
servers:
  - url: https://example.invalid
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
paths:
  /api/v1/customers:
    get:
      operationId: listCustomers
      summary: List customers.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            example: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            example: 0
      responses:
        "200":
          description: Customers
    post:
      operationId: createCustomer
      summary: Create a customer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email]
              properties:
                name:
                  type: string
                  example: string
                email:
                  type: string
                  example: user@example.com
                age:
                  type: integer
                  example: 0
      responses:
        "200":
          description: Created (documented wrongly; the API answers 201)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
  /customer/{customerId}:
    parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
    get:
      operationId: getCustomer
      summary: Fetch one customer.
      responses:
        "200":
          description: Customer
    put:
      operationId: replaceCustomer
      summary: Replace one customer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  example: string
      responses:
        "200":
          description: Replaced
    patch:
      operationId: updateCustomer
      summary: Update one customer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: string
      responses:
        "200":
          description: Updated
    delete:
      operationId: deleteCustomer
      summary: Delete one customer.
      responses:
        "204":
          description: Deleted
  /users:
    post:
      operationId: createUser
      summary: Create a login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: string
                password:
                  type: string
                  format: password
                  example: string
      responses:
        "201":
          description: Created
