# AP-033 parameter-edit fixture (specs/033-edit-step-request-body FR-020 to FR-022, amended
# 2026-09-30). Loaded through the quick path, it exercises:
# - GET /api/v1/posts         optional query parameters `limit`, `page`, `sort` (an enum) and
#                             `userId`, as in the report that prompted the amendment; an optional
#                             array `tags` (can be left out, not edited); a required `X-Tenant`
#                             header; an optional `X-Signing-Key` header of `format: password`.
# - GET /api/v1/posts/{postId} a path parameter, which comes from the environment unless edited.
openapi: 3.0.3
info:
  title: Parameter Edits Fixture
  version: "1.0"
servers:
  - url: https://example.invalid
paths:
  /api/v1/posts:
    get:
      operationId: listPosts
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [newest, oldest]
        - name: userId
          in: query
          required: false
          schema:
            type: integer
        - name: tags
          in: query
          required: false
          schema:
            type: array
            items:
              type: string
        - name: X-Tenant
          in: header
          required: true
          schema:
            type: string
        - name: X-Signing-Key
          in: header
          required: false
          schema:
            type: string
            format: password
      responses:
        "200":
          description: OK
  /api/v1/posts/{postId}:
    get:
      operationId: getPost
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: OK
